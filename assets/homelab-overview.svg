<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">Personal Active Directory and security logging lab</title>
<desc id="desc">Conceptual five virtual machine lab on one Proxmox host. A Windows workstation uses the Active Directory domain controller for DNS; external DNS requests go to Pi-hole. The domain controller, workstation and Ubuntu DNS host send telemetry to Wazuh. Kali is used for practice. No addresses or account names are shown.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#35627d"/></marker></defs>
